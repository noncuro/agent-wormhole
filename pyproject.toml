[project]
name = "agent-wormhole"
version = "0.3.0"
description = "Secure ephemeral channels for AI agent communication"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Daniel Cahn", email = "daniel@slingshot.xyz" },
]
keywords = ["ai", "agent", "communication", "encrypted", "ephemeral", "claude", "wormhole"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "typer>=0.9",
    "cryptography>=42.0",
    "coincurve>=20",
    "websockets>=14.0",
    "magic-wormhole>=0.14",
]

[project.urls]
Homepage = "https://github.com/noncuro/agent-wormhole"
Repository = "https://github.com/noncuro/agent-wormhole"
Issues = "https://github.com/noncuro/agent-wormhole/issues"

[project.scripts]
agent-wormhole = "agent_wormhole.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: marks tests that require network access (deselected by default)",
]
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
